name: Ten Workflow
on: push
run-name: "display context Info"

jobs:
  run-first-command:
    runs-on: ubuntu-latest
    steps:
      - name: Context and Expressions
        id: context-expressions
        run: |
          echo '${{ toJson(github) }}'
          echo '${{ toJson(runner) }}'
          echo '${{ toJson(job) }}'
          echo '${{ toJson(steps) }}'
      - name: Steps
        run: echo '${{ toJson(steps) }}'


