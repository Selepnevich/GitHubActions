# Секреты
# в настройках самого репазитория ищем secrets and variables -> actions
# создаем секрет
# так же можно создать Environment variables - переменные среды

name: Twelve Workflow
on: push

jobs:
    run-command:
        runs-on: ubuntu-latest
        environment: "staging"
        steps:
            - name: Secrets and Var
              run: |
                echo "${{ vars.STATUS }}"
                echo "${{ secrets.PASSWORD }}"